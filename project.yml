name: Blockyees
options:
  bundleIdPrefix: app.blockyees
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Blockyees:
    type: application
    platform: iOS
    sources:
      - path: app/Blockyees
        excludes: ["**/.gitkeep"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blockyees.notebooks
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    entitlements:
      path: config/Blockyees.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.app.blockyees.notebooks]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.app.blockyees.notebooks]
        com.apple.developer.icloud-services: [CloudDocuments]
    info:
      path: config/Info.plist
      properties:
        CFBundleDisplayName: Blockyees
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSSupportsOpeningDocumentsInPlace: YES
        UIFileSharingEnabled: NO
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.blockyees.notebook
            UTTypeDescription: Blockyees Notebook
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [blockyees]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Blockyees Notebook
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [app.blockyees.notebook]
        NSUbiquitousContainers:
          iCloud.app.blockyees.notebooks:
            NSUbiquitousContainerIsDocumentScopePublic: YES
            NSUbiquitousContainerName: Blockyees
            NSUbiquitousContainerSupportedFolderLevels: Any
  BlockyeesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [tests/UI]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Blockyees
schemes:
  Blockyees:
    build:
      targets:
        Blockyees: all
        BlockyeesUITests: [test]
    test:
      targets: [BlockyeesUITests]
